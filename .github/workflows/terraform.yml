name: Terraform OCI Deployment

on:
  push:
    branches:
      - main

jobs:
  terraform:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.0

    - name: Populate OCI Private Key File
      run: |
        echo "${{ secrets.OCI_PRIVATE_KEY }}" > oci_api_key.pem
        chmod 600 oci_api_key.pem

    - name: Terraform Init
      run: terraform init

    - name: Terraform Apply
      env:
        TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
        TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
        TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
        TF_VAR_region: "ap-mumbai-1" # <-- Change to your exact OCI region identifier
        TF_VAR_parent_compartment_ocid: ${{ secrets.OCI_TENANCY_OCID }} # Creates the compartment in your root tenancy
      run: terraform apply -auto-approve
